name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ github.repository == 'kart1ka/CleanCopy' && github.event.release.prerelease == false }}
    runs-on: macos-14
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.RELEASE_TAG) { throw new Error('release tag and package version differ') }"
      - run: npm ci
      # Trusted publishing: npm exchanges this job's GitHub OIDC token
      # (`id-token: write` above) for a short-lived publish credential, so no
      # NPM_TOKEN secret is involved. A stored token no longer works here —
      # npm now demands a one-time password for token publishes (EOTP), which
      # a CI job cannot supply. The exchange needs npm >= 11.5.1 and the
      # trusted publisher configured on npmjs.com (see RELEASING.md).
      - name: Check npm supports trusted publishing
        run: node -e "const [a,b,c]=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { throw new Error('npm >= 11.5.1 required for trusted publishing, have '+[a,b,c].join('.')) }"
      - name: Publish immutable package
        run: npm publish --access public --provenance --tag latest
