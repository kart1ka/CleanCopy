name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        node: [22, 24]
        include:
          # One Intel run: Apple Silicon runners only ever execute the arm64
          # slice of the universal helper, so without this the x86_64 half
          # ships untested. macos-15-intel is GitHub's last Intel image — if
          # the label is ever retired, replace it rather than dropping the
          # Intel coverage.
          - os: macos-15-intel
            node: 22
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: lipo -info helper/bin/cleancopy-helper
      - name: Smoke-test a packed installation
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/cleancopy-smoke" "$RUNNER_TEMP"/*.tgz
          CLI="$RUNNER_TEMP/cleancopy-smoke/node_modules/cleancopy-cli/dist/cli/index.js"
          node "$CLI" --help
          test "$(node "$CLI" --version)" = "$(node -p "require('./package.json').version")"
          CLEANCOPY_STATE_DIR="$RUNNER_TEMP/cleancopy-state" node "$CLI" doctor
          node "$CLI" clean < test/fixtures/01-wrapped-paragraph/input.txt > "$RUNNER_TEMP/cleaned.txt"
          diff -u test/fixtures/01-wrapped-paragraph/expected.txt "$RUNNER_TEMP/cleaned.txt"
