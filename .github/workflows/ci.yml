name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: lipo -info helper/bin/cleancopy-helper
      - name: Smoke-test a packed installation
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/cleancopy-smoke" "$RUNNER_TEMP"/*.tgz
          CLI="$RUNNER_TEMP/cleancopy-smoke/node_modules/cleancopy/dist/cli/index.js"
          node "$CLI" --help
          test "$(node "$CLI" --version)" = "$(node -p "require('./package.json').version")"
          node "$CLI" doctor
          node "$CLI" clean < test/fixtures/01-wrapped-paragraph/input.txt > "$RUNNER_TEMP/cleaned.txt"
          diff -u test/fixtures/01-wrapped-paragraph/expected.txt "$RUNNER_TEMP/cleaned.txt"
