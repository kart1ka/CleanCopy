name: CLI or watcher bug
description: Report a reproducible problem with installation, commands, hotkeys, or the watcher.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For text that was cleaned incorrectly, use the Incorrect cleanup form instead. Report security or privacy vulnerabilities through a private security advisory.
  - type: input
    id: version
    attributes:
      label: CleanCopy version
      description: Run `cleancopy --version`.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS, Node.js, and terminal
      description: Include the macOS version, `node --version`, and terminal name when relevant.
      placeholder: "macOS 15.6, Node v22.23.1, Terminal.app"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste the output of `cleancopy doctor`. It never includes clipboard contents.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant event log lines
      description: Optional. Include only content-free lines from `~/.cleancopy/cleancopy.log`; remove paths or identifiers you consider private.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included clipboard contents, credentials, or other sensitive data.
          required: true
